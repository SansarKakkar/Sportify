<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Sportify</title>

    <link rel="stylesheet" href="../CSS/games.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <script src="../Backend/app.js" defer></script>
    <script src="../Backend/myBookings.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-mark">S</span>
                <span>SPORTIFY</span>
            </a>

            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="./games.html">Games</a>
                <a href="./venue.html">Venues</a>
                <a href="./myBookings.html" class="active">My Bookings</a>
            </nav>

            <div class="nav-actions" id="authActions">
                <div id="loggedOutActions">
                    <a href="./role.html" class="btn btn-primary nav-btn">
                        Get Started
                    </a>
                </div>

                <div id="loggedInActions" style="display: none;">
                    <a href="./profile.html" class="welcome-link">
                        <span class="welcome-label">Welcome</span>
                        <span class="welcome-name"></span>
                    </a>
                </div>
            </div>
        </div>
    </header>


    <!-- PAGE -->

    <main class="games-page">

        <div class="page-intro">

            <p class="section-label">YOUR ACTIVITY</p>

            <div class="intro-text">
                <h1>My Bookings</h1>

                <p>
                    View the games you have joined.
                </p>
            </div>

        </div>


        <!-- RESULTS -->

        <section class="game-results">

            <div class="section-heading">

                <h2>Your Games</h2>

                <span id="resultsCount">
                    0 bookings
                </span>

            </div>


            <div id="bookingsGrid" class="games-grid"></div>


            <!-- EMPTY STATE -->

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    🏟️
                </div>

                <h3>No bookings yet</h3>

                <p>
                    You haven't joined any games yet.
                </p>

                <a href="./games.html" class="btn-primary">
                    Find a Game
                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>© 2026 Sportify. Play together.</p>

    </footer>

</body>

</html>
